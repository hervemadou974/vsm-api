<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>VSM – Ajouter un patient</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2 class="logo">VSM</h2>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="patient.html">Patients</a>
            <a class="active" href="#">Ajouter patient</a>
            <a href="#" id="logout">Déconnexion</a>
        </nav>
    </aside>

    <!-- Contenu -->
    <main class="content">
        <h1>Ajouter un patient</h1>

        <section class="card">
            <h3>Informations patient</h3>

            <form id="createPatientForm">

                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input id="nom" type="text" placeholder="Nom du patient" required>
                </div>

                <div class="form-group">
                    <label for="prenom">Prénom</label>
                    <input id="prenom" type="text" placeholder="Prénom du patient" required>
                </div>

                <div class="form-group">
                    <label for="date_naissance">Date de naissance</label>
                    <input id="date_naissance" type="date">
                </div>

                <div class="form-group">
                    <label for="vulnerabilite">Niveau de vulnérabilité</label>
                    <select id="vulnerabilite">
                        <option value="">Sélectionner</option>
                        <option value="faible">Faible</option>
                        <option value="moyenne">Moyenne</option>
                        <option value="élevée">Élevée</option>
                    </select>
                </div>

                <div style="display:flex; gap:15px; margin-top:20px;">
                    <button type="submit" class="btn-primary">
                        Créer le patient
                    </button>

                    <a href="patient.html" class="btn-secondary">
                        Annuler
                    </a>
                </div>

            </form>
        </section>

    </main>

</div>

<script src="../js/app.js"></script>
</body>
</html>
